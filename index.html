<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DENISIA | TOP SECRET ACCESS</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: #00BFFF;
            font-family: 'Arial Black', sans-serif;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* КОСМИЧЕСКИЙ ФОН */
        #bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #001a33 0%, #000 80%);
            z-index: -1;
        }

        .container {
            text-align: center;
            border: 3px solid #00BFFF;
            padding: 50px;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 50px rgba(0, 191, 255, 0.5);
            backdrop-filter: blur(10px);
            max-width: 500px;
        }

        .logo { font-size: 40px; text-shadow: 0 0 20px #00BFFF; margin-bottom: 10px; }
        .label { font-size: 14px; letter-spacing: 5px; color: #fff; margin-bottom: 30px; }
        
        /* КЛЮЧ */
        .access-key {
            font-size: 60px;
            background: #111;
            border: 2px dashed #00BFFF;
            padding: 20px;
            display: inline-block;
            margin: 20px 0;
            color: #fff;
            text-shadow: 0 0 15px #00BFFF;
            letter-spacing: 10px;
        }

        .instruction { font-size: 12px; color: #555; margin-top: 20px; line-height: 1.6; }
        
        /* КНОПКА КОПИРОВАНИЯ */
        .copy-btn {
            background: #00BFFF; color: #000;
            border: none; padding: 15px 30px;
            font-weight: bold; cursor: pointer;
            margin-top: 20px; transition: 0.3s;
        }
        .copy-btn:hover { background: #fff; transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="bg"></div>

    <div class="container">
        <div class="logo">DENISIA</div>
        <div class="label">EMPIRE ACCESS KEY</div>
        
        <div class="access-key" id="keyText">191919</div>
        
        <br>
        <button class="copy-btn" onclick="copyKey()">COPY KEY</button>

        <div class="instruction">
            ENTER THIS KEY INTO YOUR LAUNCHER<br>
            TO ACTIVATE FULL EMPIRE EDITION.
        </div>
    </div>

    <script>
        function copyKey() {
            const key = document.getElementById('keyText').innerText;
            navigator.clipboard.writeText(key);
            alert("ACCESS KEY COPIED!");
        }
    </script>
</body>
</html>
